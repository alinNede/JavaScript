<!doctype html>
<html lang="en">
  <head>
    <title>Dictionary</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  </head>
  <body>
    <h1 style="text-align: center;">Dictionary</h1> 
    <div class="card text-center">
        <div class="card-header">
            Save Word
        </div>
        <div class="card-body">
            <div class="input-group">
                <span class="input-group-text">Word / Translation</span>
                <input id="save-word" type="text" aria-label="Word" class="form-control">
                <input id="translated-word" type="text" aria-label="Translation" class="form-control">
            </div>
        </div>
        <div class="card-footer">
            <button id="save-button" class="btn btn-primary" type="button">Save</button>
        </div>
        <br>
    </div>  
    <div class="card text-center">
        <br>
        <div class="card-header">
            Find Word
        </div>
        <div class="card-body">
            <div class="input-group">
                <span class="input-group-text">Search / Answer</span>
                <input id="search-word" type="text" aria-label="Word" class="form-control">
                <input id="answer-word" type="text" aria-label="Translation" class="form-control">
            </div>
        </div>
        <div class="card-footer">
            <button id="find-button" class="btn btn-primary" type="button">Find</button>
        </div>
        <br>
    </div>  
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
